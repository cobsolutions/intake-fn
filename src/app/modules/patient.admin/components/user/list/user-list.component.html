<ngx-spinner></ngx-spinner>
<!-- Header -->
<div class="header">
    <div class="header-content">
        <div class="header-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </div>
        <div class="header-text">
            <h1>Users Manager</h1>
        </div>
    </div>
</div>
<!-- Search Panel -->
<div class="search-panel">
    <div class="search-title">
        <h2>Search Users</h2>
        <p>find a user by name , email or role</p>
    </div>

    <div class="search-bar">
        <!-- Name -->
        <div class="search-input-wrapper">
            <svg class="search-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" placeholder="Search by name" [(ngModel)]="searchName" class="search-input" />
        </div>

        <!-- Email -->
        <div class="search-input-wrapper">
            <svg class="search-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M4 4h16v16H4V4zm8 8L4 6m16 0l-8 6m8 6l-8-6m8 6H4" />
            </svg>
            <input type="text" placeholder="Search by email" [(ngModel)]="searchEmail" class="search-input" />
        </div>

        <!-- Role -->
        <div class="search-input-wrapper">
            <svg class="search-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M12 5v14m7-7H5" />
            </svg>
            <select [(ngModel)]="searchRole" class="search-input">
                <option value="">Select role</option>
                <option value="Administrator">Administrator</option>
                <option value="Normal">Normal</option>
            </select>
        </div>

        <!-- Search button -->
        <button class="search-btn" (click)="searchUsers()">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M3 12h18M9 6l-6 6 6 6" />
            </svg>
            Search
        </button>
        <button class="btn-clear" (click)="clearSearch()">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
            Clear
          </button>
    </div>

</div>
<!-- Table -->
<div class="batch-table-container">
    <table cTable *ngIf="users" small class="batch-table">
        <thead cTableColor="light">
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Email</th>
                <th scope="col">Role</th>
                <th scope="col">Created At</th>
                <th scope="col" style="width: 10%;">Action</th>
                <th scope="col"></th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let user of users; index as i;">
                <td>{{user.name}}</td>
                <td>{{user.email}}</td>
                <td>
                    <c-badge color="primary" *ngIf="user.userRole === 'administrator'">{{user.userRole}}</c-badge>
                    <c-badge color="warning" *ngIf="user.userRole === 'normal'">{{user.userRole}}</c-badge>
                </td>
                <td>{{user.createdAt | date:"MM/dd/yyyy hh:mm a"}}</td>
                <td>
                    <div class="btn-group" role="group">
                        <button cButton variant="outline" (click)="showEditUser(user.uuid!)" size="sm"
                            class="action-btn">
                            Change
                        </button>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</div>
<!-- Floating Create Button -->
<button class="floating-create-btn" (click)="showCreateUser()">
    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="white" viewBox="0 0 16 16">
        <path
            d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z" />
    </svg>
</button>
<c-modal id="createUSer" [visible]="isCreateUSer" size="xl" backdrop="static">
    <c-modal-header>
        <h3 cModalTitle>User Creation</h3>
        <button (click)="toggleCreateUser()" cButtonClose></button>
    </c-modal-header>
    <c-modal-body>
        <user-creation (changeVisibility)="changeClinicVisibility($event)" *ngIf="isCreateUSer"></user-creation>
    </c-modal-body>
</c-modal>
<c-modal id="editUSer" [visible]="isEditUser" size="xl" backdrop="static">
    <c-modal-header>
        <h3 cModalTitle>Edit User</h3>
        <button (click)="toggleEditUser()" cButtonClose></button>
    </c-modal-header>
    <c-modal-body>
        <user-creation (changeVisibility)="changeClinicVisibility($event)" *ngIf="isEditUser"
            [selectedUser]="selectedUser"></user-creation>
    </c-modal-body>
</c-modal>
