<ngx-spinner></ngx-spinner>
<c-row>

    <c-col xs="12" class="mb-4">
        <c-card>
            <c-card-header ngPreserveWhitespaces>
                <strong>Patients Source Reports</strong>
            </c-card-header>
            <c-card-body>
                <div *ngIf="searchErrorMessage !==undefined" class="mb-2">
                    <label class="text-danger fw-normal fst-italic">{{searchErrorMessage}}</label>
                </div>
                <c-callout color="danger" *ngIf="searchInputNotValid">
                    <span class="text-danger fw-bold">{{errorMsg}}</span>
                </c-callout>
                <form cForm>
                    <c-row>
                        <c-col xs="6" class="mb-2">
                            <c-card>
                                <c-card-header>
                                    <h6>
                                        Patient Source
                                    </h6>
                                </c-card-header>
                                <c-card-body>
                                    <c-col class="mb-2" xs="12">
                                        <form cForm>
                                            <select cSelect cFormControl name="recommendation"
                                                [(ngModel)]="patientSearchCriteria.sourceType">
                                                <option value="null">Select Patient Source</option>
                                                <option value="referring">Referring Provider</option>
                                                <option value="direct">Direct Access</option>
                                            </select>
                                        </form>
                                    </c-col>
                                    <!--Referring Doctor -->
                                    <div *ngIf="patientSearchCriteria.sourceType === 'referring'">
                                        <c-col class="mb-2" xs="12">
                                            <form cForm>
                                                <label for="doctor-name" class="form-label">Provider Name</label>
                                                <input cFormControl placeholder="Provider Name" name="doctor-name"
                                                    [(ngModel)]="patientSearchCriteria.doctorName" />
                                            </form>
                                        </c-col>
                                        <c-col class="mb-2" xs="12">
                                            <form cForm>
                                                <label for="doctor-npi" class="form-label">Provider NPI</label>
                                                <input numbers cFormControl placeholder="Provider NPI" name="doctor-npi"
                                                    [(ngModel)]="patientSearchCriteria.doctorNPI" maxlength="10" />
                                            </form>
                                        </c-col>
                                    </div>
                                    <div *ngIf="patientSearchCriteria.sourceType !== null">
                                        <c-col class="mb-2" xs="12">
                                            <form cForm>
                                                <label for="doctor-name" class="form-label">Source</label>
                                                <c-multi-select multiple selectionType="counter"
                                                    (valueChange)="changeSources($event)">
                                                    <c-multi-select-option *ngFor="let patientSource of patientSources"
                                                        [value]="patientSource.entityValue"
                                                        [selected]="patientSource.selected">
                                                        {{patientSource.entityName}}
                                                    </c-multi-select-option>
                                                </c-multi-select>
                                            </form>
                                        </c-col>
                                    </div>
                                </c-card-body>
                            </c-card>
                        </c-col>
                        <c-col xs="6" class="mb-2">
                            <c-card>
                                <c-card-header>
                                    <h6>Date Range</h6>
                                </c-card-header>
                                <c-card-body>
                                    <c-col class="mb-2" xs="12">
                                        <c-date-range-picker [(startDate)]="patientSearchCriteria.startDate_date"
                                            [(endDate)]="patientSearchCriteria.endDate_date"
                                            [ranges]="customRanges"></c-date-range-picker>
                                    </c-col>
                                </c-card-body>
                            </c-card>
                        </c-col>
                        <c-col xs="12" class="text-center">
                            <button cButton class="me-1" (click)="search()" color="primary" variant="outline"
                                style="width: 15%;">
                                Search
                            </button>
                        </c-col>
                    </c-row>
                </form>
            </c-card-body>
        </c-card>
    </c-col>
    <c-container class="text-end">
        <button cButton (click)="exportResult()" variant="outline">Export Result
            <svg cIcon name="cilCloudDownload"></svg>
        </button>
    </c-container>
    <c-col xs="12">
        <ng-container *ngIf="props$ | async as props" fluid="true">
            <c-smart-table [columns]="columns" [items]="(patients$ | async) ?? []" [itemsPerPage]="props.itemsPerPage"
                (itemsPerPageChange)="handleItemsPerPageChange($event)" [itemsPerPageOptions]="[5,10,20]"
                [itemsPerPageSelect]="true" [columnFilterValue]="props.columnFilterValue?? []"
                [sorterValue]="props.sorterValue" [tableProps]="{ hover: true, striped: true  }"
                [tableBodyProps]="{ align: 'middle' }" (sorterValueChange)="handleSorterValueChange($event)" header>
                <ng-template cTemplateId="tableData" let-columnName="columnName" let-item="item"
                    let-tdContent="tdContent">
                    <td>
                        <ng-container [ngSwitch]="columnName">
                            <ng-container *ngSwitchCase="'createdAt'">
                                {{(item[columnName]) | date}}
                            </ng-container>
                            <ng-container *ngSwitchDefault>
                                {{tdContent}}
                            </ng-container>
                        </ng-container>
                    </td>
                </ng-template>
            </c-smart-table>
            <c-smart-pagination *ngIf="props.totalPages" [activePage]="props.activePage"
                (activePageChange)="handleActivePageChange($event)" [pages]="props.totalPages"></c-smart-pagination>
        </ng-container>

    </c-col>
</c-row>
