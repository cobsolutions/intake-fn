# Deploy intake-web to the SHARED STAGING host.
# Commit to cobsolutions/intake-fn on branch "aws-staging" as .github/workflows/deploy-staging.yml
# Run it: GitHub -> Actions -> "Deploy to staging" -> Run workflow (branch: aws-staging).
# AWS only accepts it from THAT repo and THAT branch (OIDC trust), so running it
# from any other branch fails at "Configure AWS credentials" by design.
# Source of truth: AWS-Terraform-Structure/docs/shared-staging/workflows/intake-web.yml
name: Deploy to staging

on:
  workflow_dispatch: # manual only, for now

permissions:
  id-token: write # OIDC -> AWS, no stored keys
  contents: read

concurrency:
  group: staging-deploy-intake-web
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  APP: intake-web
  ROLE_ARN: arn:aws:iam::088850687177:role/staging-shared-deploy-intake-web
  ECR_REPO: 088850687177.dkr.ecr.us-east-1.amazonaws.com/staging-shared/intake-web
  SSM_DOCUMENT: staging-shared-deploy-intake-web
  HOST_TAG: staging-shared

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm # the host is Graviton: build arm64 natively
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (tag = commit SHA)
        run: |
          # Tags are immutable: re-running the same commit reuses its image.
          if aws ecr describe-images --repository-name "staging-shared/$APP" \
               --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Image $GITHUB_SHA already in ECR, skipping build."
            exit 0
          fi
          docker build --platform linux/arm64 \
            -t "$ECR_REPO:$GITHUB_SHA" .
          docker push "$ECR_REPO:$GITHUB_SHA"

      - name: Deploy on the host (SSM)
        run: |
          IID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$HOST_TAG" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          echo "Host: $IID"
          CID=$(aws ssm send-command --instance-ids "$IID" --document-name "$SSM_DOCUMENT" \
            --parameters "tag=$GITHUB_SHA" \
            --comment "$GITHUB_REPOSITORY@${GITHUB_SHA::7} by $GITHUB_ACTOR" \
            --query Command.CommandId --output text)
          echo "SSM command: $CID"
          STATUS=Pending
          for i in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" \
            --query StandardErrorContent --output text >&2
          echo "Result: $STATUS"
          [ "$STATUS" = "Success" ]
