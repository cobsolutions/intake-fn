<ngx-spinner></ngx-spinner>
<c-row>
    <c-col xs="12" class="mb-4">
        <c-card>
            <c-card-header ngPreserveWhitespaces>
                <strong>Patients Survey Report</strong>
            </c-card-header>
            <c-card-body>
                <p class="text-medium-emphasis small">
                    The ability to create patient reports for survey data,
                </p>
                <form [formGroup]="searchForm" (ngSubmit)="search()" class="search-form">
                    <c-row>
                        <c-col xs="12" class="mb-2" *ngIf="clinics">
                            <label>Clinic</label>
                            <select cSelect cFormControl name="clinic" formControlName="selectedClinic">
                                <option [value]="null">Select Clinic</option>
                                <option *ngFor="let clinic of clinics" [value]="clinic.id">
                                    {{clinic.name}}</option>
                            </select>
                            <div *ngIf="searchForm.get('selectedClinic')?.invalid && searchForm.get('selectedClinic')?.touched"
                                class="text-danger">
                                Clinic is required
                            </div>
                        </c-col>
                        <c-col xs="12" class="mb-2">
                            <label>Start At</label>
                            <input type="date" formControlName="startAt" cFormControl />
                            <div *ngIf="searchForm.get('startAt')?.invalid && searchForm.get('startAt')?.touched"
                                class="text-danger">
                                Start date is required
                            </div>
                            <label>End At</label>
                            <input type="date" formControlName="endAt" cFormControl />
                            <div *ngIf="searchForm.get('endAt')?.invalid && searchForm.get('endAt')?.touched"
                                class="text-danger">
                                End date is required
                            </div>
                        </c-col>
                    </c-row>
                    <c-row>
                        <c-col xs="12" class="text-center">
                            <button cButton class="me-1" color="primary" variant="outline" type="submit"
                                style="width: 15%;">
                                Search
                            </button>
                        </c-col>
                    </c-row>
                </form>

            </c-card-body>
        </c-card>
    </c-col>
    <c-container class="text-end">
        <button cButton variant="outline" (click)="exportResult()"
            [disabled]="exportData ===undefined ||exportData.length === 0">Export Result
            <svg cIcon name="cilCloudDownload"></svg>
        </button>
