<div [formGroup]="form" class="mt-3 text-center">
    <c-card>
        <c-card-body>
            <c-row>
                <c-col xs="12">
                    <webcam [trigger]="triggerObservable()" (imageCapture)="handleImage($event)"
                        (initError)="handleInitError($event)" *ngIf="isActive ===2">
                    </webcam>
                </c-col>
                <c-col xs="12">
                    <button cButton (click)="captureImage()">Capture</button>
                </c-col>
            </c-row>
            <c-row>
                <c-col>
                    <div *ngIf="webcamImage">
                        <img [src]="webcamImage.imageAsDataUrl" alt="Captured face">
                    </div>
                </c-col>
            </c-row>
        </c-card-body>
    </c-card>
</div>
<div class="mt-3">
    <button cButton variant="outline" size="sm" (click)="next()">Next</button>
</div>
