<div class="email-verification-container">
    <!-- Loading Spinner -->
    <div *ngIf="isLoading" class="card">
      <div class="spinner"></div>
      <div class="content">
        <h1 class="title">Verifying Phone...</h1>
        <p class="description">
          Please wait while we verify your phone. This may take a few seconds.
        </p>
      </div>
    </div>
  </div>
