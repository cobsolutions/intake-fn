<ngx-spinner></ngx-spinner>
<c-row>
    <c-col xs="12" class="mb-4">
        <c-card>
            <c-card-header ngPreserveWhitespaces>
                <strong>Patients Contact Report</strong>
            </c-card-header>
            <c-card-body>
                <p class="text-medium-emphasis small">
                    The ability to create patient reports using his/her contacts,
                </p>
                <form [formGroup]="searchForm" (ngSubmit)="search()" class="search-form">
                    <c-row>
                        <c-col xs="12" class="mb-2">
                            <label>Contact Type</label>
                            <select formControlName="contactType" cSelect>
                                <option *ngFor="let type of contactTypes" [value]="type.value">
                                  {{ type.label }}
                                </option>
                              </select>
                        </c-col>
                        <c-col xs="12" class="mb-2">
                            <label>Contact Time</label>
                            <select formControlName="contactTime" cSelect>
                                <option *ngFor="let time of contactTimes" [value]="time.value">
                                  {{ time.label }}
                                </option>
                              </select>
                        </c-col>
                        <c-col xs="12" class="mb-2">
                            <label>Patient Name</label>
                            <input type="text" formControlName="patientName" cFormControl />
                        </c-col>
                        <c-col xs="12" class="mb-2" *ngIf="clinics">
                            <label>Clinic</label>
                            <select cSelect cFormControl name="clinic"  formControlName="selectedClinic">
                                <option [value]="null">Select Clinic</option>
                                <option *ngFor="let clinic of clinics" [value]="clinic.id">
                                    {{clinic.name}}</option>
                            </select>
                            <div *ngIf="searchForm.get('selectedClinic')?.invalid && searchForm.get('selectedClinic')?.touched"
                                class="error">
                                Clinic is required
                            </div>
                        </c-col>
                        <c-col xs="12" class="mb-2">
                            <label>Start At</label>
                            {{searchForm.get('startAt')?.invalid}}
                            <input type="date" formControlName="startAt" cFormControl />
                            <div *ngIf="searchForm.get('startAt')?.invalid && searchForm.get('startAt')?.touched"
                                class="error">
                                Start date is required
                            </div>
                            <label>End At</label>
                            <input type="date" formControlName="endAt" cFormControl />
                            <div *ngIf="searchForm.get('endAt')?.invalid && searchForm.get('endAt')?.touched"
                                class="error">
                                End date is required
                            </div>
                        </c-col>
                    </c-row>
                    <c-row>
                        <c-col xs="12" class="text-center">
                            <button cButton class="me-1"  color="primary" variant="outline"  type="submit"
                                 style="width: 15%;">
                                Search
                            </button>
                        </c-col>
                    </c-row>
                </form>

            </c-card-body>
        </c-card>
    </c-col>
    <c-container class="text-end">
        <button cButton variant="outline" (click)="exportResult()"
            [disabled]="exportData ===undefined ||exportData.length === 0">Export Result
            <svg cIcon name="cilCloudDownload"></svg>
        </button>
    </c-container>
    <c-col xs="12">
        <ng-container *ngIf="props$ | async as props" fluid="true">
            <c-smart-table [columns]="columns" [items]="(patientData$ | async) ?? []"
                [itemsPerPage]="props.itemsPerPage" (itemsPerPageChange)="handleItemsPerPageChange($event)"
                [itemsPerPageOptions]="[5,10,20]" [itemsPerPageSelect]="true"
                [columnFilterValue]="props.columnFilterValue?? []" [sorterValue]="props.sorterValue"
                [tableProps]="{ hover: true, striped: true  }" [tableBodyProps]="{ align: 'middle' }"
                (sorterValueChange)="handleSorterValueChange($event)" header>
                <ng-template cTemplateId="tableData" let-columnName="columnName" let-item="item"
                    let-tdContent="tdContent">
                    <td>
                        <ng-container [ngSwitch]="columnName">
                            <ng-container *ngSwitchCase="'patientName'">
                                {{item.lastName}} , {{item.firstName}}
                            </ng-container>
                            <ng-container *ngSwitchDefault>
                                {{tdContent}}
                            </ng-container>
                        </ng-container>
                    </td>
                </ng-template>
            </c-smart-table>
            <c-smart-pagination *ngIf="props.totalPages" [activePage]="props.activePage"
                (activePageChange)="handleActivePageChange($event)" [pages]="props.totalPages"></c-smart-pagination>
        </ng-container>
    </c-col>
</c-row>
