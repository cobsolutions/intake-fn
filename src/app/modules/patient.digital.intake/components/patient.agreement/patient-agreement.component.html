<c-callout color="danger" *ngIf="isValidForm">
    Please all mandatory agreements <strong class="text-danger">marked with red star</strong> before navigating to next
    step
</c-callout>
<div [formGroup]="form" class="mt-3">
    <div formArrayName="agreement">
        <c-accordion [alwaysOpen]="false" [flush]="false" class="shadow">
            <c-accordion-item #item0="cAccordionItem" [visible]="false"
                *ngFor="let agreement of agreements; index as i;">
                <ng-template cTemplateId="accordionHeaderTemplate">
                    <button (click)="item0.toggleItem()" [collapsed]="!item0.visible" cAccordionButton>
                        <h5>{{agreement.agreementName}} <span class="text-danger" *ngIf="agreement.required">*</span>
                        </h5>
                    </button>
                </ng-template>
                <ng-template cTemplateId="accordionBodyTemplate">
                    <c-row>
                        <c-col xs="auto">
                            <div [innerHTML]="agreement.agreementText" class="accordion-body">
                            </div>
                        </c-col>
                        <c-col xs="auto" class="ms-3">
                            <c-form-check>
                                <input cFormCheckInput  type="checkbox"
                                    [formControlName]="agreement.fieldName" />
                                <label cFormCheckLabel for="release">I accept</label>
                            </c-form-check>
                        </c-col>
                    </c-row>
                </ng-template>
            </c-accordion-item>


        </c-accordion>
    </div>
    <div class="mt-3">
        <button cButton matStepperPrevious size="sm" variant="outline" class="mx-2">Back</button>
        <button cButton variant="outline" size="sm" (click)="next()">Next</button>
    </div>
</div>
