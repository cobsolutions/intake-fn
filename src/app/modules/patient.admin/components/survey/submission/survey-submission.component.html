<div class="mb-3">
    <c-card>
        <c-card-body>
            <h5 cCardTitle>Choose Submission Approach</h5>
            <p cCardText>Please select how you would like to submit the survey.</p>
            <div class="mb-3">
                <select aria-label="Default select example" cSelect id="survey" [(ngModel)]="surveyType">
                    <option selected disabled value="undefined">Select Survey</option>
                </select>
            </div>
            <div class="mb-3">
                <select aria-label="Default select example" cSelect id="submission_approach"
                    [(ngModel)]="submissionApproach">
                    <option selected disabled value="undefined">Select Submission Approach</option>
                    <option value="device">Scan QR-Code By Device</option>
                    <option value="mail">Send Patient Mail</option>
                </select>
            </div>
        </c-card-body>
    </c-card>
</div>
<c-card *ngIf="submissionApproach ==='device'">
    <c-card-header>
        <h4>Generate QR-Code</h4>
    </c-card-header>
    <c-card-body>
        <request-device-survey-submission-component
            *ngIf="submissionApproach ==='device'"></request-device-survey-submission-component>
    </c-card-body>
</c-card>
<c-card *ngIf="submissionApproach ==='mail'">
    <c-card-header>
        <h4>Send Mail</h4>
    </c-card-header>
    <c-card-body>
    </c-card-body>
</c-card>
