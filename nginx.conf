server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Angular router: unknown paths load the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
  # Hashed bundles may be cached for long; the shell must not be.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location ~* \.(js|css|woff2?|png|svg|ico)$ { add_header Cache-Control "public, max-age=31536000, immutable"; }
}
