<ngx-spinner></ngx-spinner>
<c-row>
    <c-col xs="12">
        <h1>Survey</h1>
    </c-col>
    <c-col xs="12">
        <div style="float: right;">
            <button cButton color="primary" variant="outline" (click)="showPatientPelvicSurvey()" style="width: 200px;">
                Create
            </button>
        </div>
    </c-col>
</c-row>


<c-modal id="survey" [visible]="isSurvey" size="xl" backdrop="static">
    <c-modal-body>
        <button (click)="togglePatientPelvicSurvey()" cButtonClose style="float: right;"></button>
        <generate-survey *ngIf="isSurvey"></generate-survey>
    </c-modal-body>
</c-modal>
