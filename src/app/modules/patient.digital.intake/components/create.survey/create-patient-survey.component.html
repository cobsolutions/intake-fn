<div class="survey-container" *ngIf="survey">
    <!-- Sticky header -->
    <div class="survey-sticky-header">
      <div class="survey-header">
        <div class="header-icon"><i class="fas fa-heartbeat"></i></div>
        <h1>{{ survey.name }}</h1>
        <p class="survey-description">Your health journey matters. This assessment helps us understand your needs better.</p>
      </div>
  
      <div class="progress-container">
        <div class="progress-bar">
          <div class="progress-fill" [style.width.%]="progress"></div>
        </div>
        <div class="progress-text">{{ progress }}% Complete</div>
      </div>
    </div>
  
    <form [formGroup]="surveyForm" (ngSubmit)="onSubmit()">
      <ng-container *ngFor="let section of survey.sections; let sIndex = index">
        <div class="survey-section">
          <div class="section-header">
            <h2>{{ section.title }}</h2>
          </div>
  
          <div class="question" *ngFor="let question of section.questions; let i = index">
            <p class="question-text">{{ i + 1 }}. {{ question.text }}</p>
            <div class="options-container">
              <label class="option" *ngFor="let option of question.answerOptions">
                <input type="radio"
                       [formControlName]="question.key"
                       [value]="option.value"
                       [name]="question.key">
                <span class="checkmark"></span>
                <span class="option-label">{{ option.label }}</span>
              </label>
            </div>
          </div>
        </div>
      </ng-container>
  
      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="resetForm()">
          <i class="fas fa-redo"></i> Reset Form
        </button>
        <button type="submit" class="btn-primary" [disabled]="!surveyForm.valid">
          <i class="fas fa-paper-plane"></i> Submit Survey
        </button>
      </div>
    </form>
  </div>
